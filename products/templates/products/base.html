<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        Product Management
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}"> Product Management </a>
            {% if user.is_authenticated %}

            <div class="d-flex gap-2">

                <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">Dashboard</a>
                <a href="{% url 'product_list' %}" class="btn btn-outline-light btn-sm"> Products</a>
                <a href="{% url 'product_add' %}" class="btn btn-primary btn-sm">Add Product</a>
                <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <main class="container py-4">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>
</body>

</html>
